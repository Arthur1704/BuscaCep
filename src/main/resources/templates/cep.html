<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP</title>
    <link rel="stylesheet" th:href="@{/css/cep.css}">
</head>

<body>

    <div class="container">
        <h2>Buscar CEP</h2>

        <div th:if="${erro != null}" class="alert alert-error">
            <span th:text="${erro}"></span>
        </div>

        <form method="post" th:action="@{/buscar-cep}" class="form-group">
            <input type="text" name="rua" placeholder="Rua / Logradouro" required>
            <div style="display: grid; grid-template-columns: 1fr 100px; gap: 10px;">
                <input type="text" name="cidade" placeholder="Cidade" required>
                <input type="text" name="estado" placeholder="UF (ex: SP)" maxlength="2" required>
            </div>
            <button type="submit">Buscar por Endereço</button>
        </form>

        <div th:if="${cep != null}" class="result-box">
            <h3>Resultado:</h3>
            <p><strong>Rua:</strong> <span th:text="${rua}"></span></p>
            <p><strong>Cidade/UF:</strong> <span th:text="${cidade + ' - ' + estado}"></span></p>
            <p style="font-size: 1.2em; color: var(--primary-color);">
                <strong>CEP:</strong> <span th:text="${cep}"></span>
            </p>
        </div>

        <hr>

        <div class="file-section">
            <h3>Processar Lote (CSV)</h3>
            <p style="font-size: 0.85em; color: #666; margin-bottom: 15px;">
                Formato esperado: Rua, Cidade, UF
            </p>
            <form method="post" th:action="@{/upload-csv}" enctype="multipart/form-data" class="form-group">
                <input type="file" name="arquivo" accept=".csv" required>
                <button type="submit" style="background-color: #2c3e50;">Processar Lista</button>
            </form>
        </div>
    </div>

    <div class="container" style="max-width: 800px;" th:if="${listaResultados != null}">
        <h3>Resultados do Arquivo</h3>
        <table>
            <thead>
                <tr>
                    <th>Rua</th>
                    <th>Cidade</th>
                    <th>UF</th>
                    <th>CEP</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${listaResultados}">
                    <td th:text="${item[0]}"></td>
                    <td th:text="${item[1]}"></td>
                    <td th:text="${item[2]}"></td>
                    <td style="font-weight: bold; color: #4a90e2;" th:text="${item[3]}"></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
